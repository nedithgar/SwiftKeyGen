name: CI
permissions:
  contents: read

on:
  push:
    branches: [ main, chore/**, feat/**, fix/**, refactor/**, test/** ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }} - Swift 6.2)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Swift
        uses: ./.github/actions/setup-swift

      - name: Resolve Dependencies
        run: swift package resolve

      - name: Build (Release)
        run: swift build -c release

      - name: Run Full Test Suite (Release Mode) (with retries)
        run: |
          set -euo pipefail
          max_attempts=3
          attempt=1
          until swift test -c release; do
            exit_code=$?
            echo "Test run failed with exit code ${exit_code} (attempt ${attempt}/${max_attempts})." >&2
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Exceeded maximum attempts. Failing." >&2
              exit "$exit_code"
            fi
            sleep_for=$(( attempt * 30 ))
            echo "Retrying in ${sleep_for}s..." >&2
            sleep "$sleep_for"
            attempt=$(( attempt + 1 ))
          done
        shell: bash
